<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<title>Jeopardy!</title>
<style>
  :root {
    --bg1:#1b1646; --bg2:#2a1b6e; --ink:#fff; --soft:#ffffff1f; --dark:#1a1240;
    --c1:#ff6b6b; --c2:#ffb020; --c3:#2ed8a3; --c4:#38bdf8; --c5:#a78bfa; --c6:#f472b6;
    --font:"Nunito","SF Pro Rounded",ui-rounded,system-ui,-apple-system,"Helvetica Neue",sans-serif;
    --display:"Fredoka","Nunito","SF Pro Rounded",ui-rounded,system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; color:var(--ink); font-family:var(--font); font-weight:600;
    background:
      radial-gradient(60vw 50vh at 10% 0%, #ff6b6b44, transparent 60%),
      radial-gradient(50vw 50vh at 100% 10%, #38bdf844, transparent 60%),
      radial-gradient(60vw 60vh at 80% 110%, #a78bfa55, transparent 60%),
      radial-gradient(50vw 40vh at 0% 100%, #2ed8a333, transparent 60%),
      linear-gradient(160deg,var(--bg1),var(--bg2)); background-attachment:fixed; }
  button { font:inherit; cursor:pointer; }
  .hidden { display:none !important; }

  .btn { background:var(--soft); color:#fff; border:0; border-radius:999px; padding:9px 18px; font-weight:800;
    backdrop-filter:blur(6px); transition:transform .12s, background .12s, box-shadow .12s; }
  .btn:hover { background:#ffffff38; transform:translateY(-1px); }
  .btn:active { transform:translateY(1px) scale(.98); }
  .btn.gold { background:linear-gradient(135deg,#ffd23f,#ff9f1c); color:var(--dark); box-shadow:0 4px 16px #ff9f1c66; }
  .btn.gold:hover { background:linear-gradient(135deg,#ffe066,#ffb347); }
  .btn.green { background:linear-gradient(135deg,#2ed8a3,#18b585); color:#06352a; }
  .btn.red { background:linear-gradient(135deg,#ff7a7a,#f0495c); color:#fff; }
  .btn.ghost { background:transparent; box-shadow:inset 0 0 0 2px #ffffff40; }

  #app { display:flex; flex-direction:column; height:100%; }
  header { display:flex; align-items:center; gap:10px; padding:14px 22px 6px; }
  header h1 { margin:0; font-family:var(--display); font-weight:700; font-size:34px; letter-spacing:1px;
    background:linear-gradient(90deg,var(--c2),var(--c1),var(--c6),var(--c5),var(--c4));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  header .sp { flex:1; }

  /* Board */
  #boardWrap { flex:1; padding:10px 22px; min-height:0; display:flex; }
  #board { flex:1; display:grid; gap:12px; grid-template-columns:repeat(6,1fr); }
  #board > :nth-child(6n+1){--col:var(--c1)} #board > :nth-child(6n+2){--col:var(--c2)} #board > :nth-child(6n+3){--col:var(--c3)}
  #board > :nth-child(6n+4){--col:var(--c4)} #board > :nth-child(6n+5){--col:var(--c5)} #board > :nth-child(6n+0){--col:var(--c6)}
  .cat,.tile { display:flex; align-items:center; justify-content:center; text-align:center; border-radius:18px; }
  .cat { background:#ffffff1c; border-bottom:5px solid var(--col); font-family:var(--display); font-weight:600; text-transform:uppercase;
    letter-spacing:1.5px; padding:10px 8px; font-size:clamp(12px,1.5vw,22px); backdrop-filter:blur(6px); }
  .tile { border:0; color:var(--dark); font-family:var(--display); font-weight:700; font-size:clamp(24px,4.2vw,62px);
    background:linear-gradient(160deg, color-mix(in srgb,var(--col) 70%,#fff), var(--col));
    box-shadow:0 6px 0 color-mix(in srgb,var(--col) 55%,#000), 0 12px 24px #0004;
    transition:transform .14s cubic-bezier(.3,1.6,.5,1), filter .14s; }
  .tile:hover:not(.used) { transform:translateY(-4px) scale(1.04) rotate(-.6deg); filter:brightness(1.08); }
  .tile:active:not(.used) { transform:translateY(3px); box-shadow:0 2px 0 color-mix(in srgb,var(--col) 55%,#000); }
  .tile.used { background:#ffffff0d; box-shadow:none; color:transparent; cursor:default; }

  /* Scores */
  #scores { display:flex; gap:14px; padding:12px 22px 20px; justify-content:center; flex-wrap:wrap; }
  #scores > :nth-child(6n+1){--col:var(--c1)} #scores > :nth-child(6n+2){--col:var(--c4)} #scores > :nth-child(6n+3){--col:var(--c3)}
  #scores > :nth-child(6n+4){--col:var(--c2)} #scores > :nth-child(6n+5){--col:var(--c5)} #scores > :nth-child(6n+0){--col:var(--c6)}
  .team { min-width:170px; flex:1; max-width:280px; background:#ffffff1c; border-top:6px solid var(--col); border-radius:20px;
    text-align:center; padding:8px 10px 10px; backdrop-filter:blur(6px); transition:transform .2s cubic-bezier(.3,1.6,.5,1), box-shadow .2s; }
  .team.active { background:linear-gradient(160deg,color-mix(in srgb,var(--col) 75%,#fff),var(--col)); color:var(--dark);
    transform:translateY(-4px) scale(1.04); box-shadow:0 0 0 3px #fff8, 0 10px 30px color-mix(in srgb,var(--col) 70%,transparent); }
  .team .name { font-weight:800; cursor:pointer; letter-spacing:.5px; }
  .team .pts { font-family:var(--display); font-size:38px; font-weight:700; line-height:1.15; }
  .team .pts.neg { color:#ff5470; } .team.active .pts.neg { color:#a3002a; }
  .team .adj button { background:#00000026; color:inherit; border:0; border-radius:999px; padding:2px 10px; margin:0 3px; font-weight:800; }
  .team .adj button:hover { background:#0000003d; }

  /* Clue overlay */
  #clue { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    background:
      radial-gradient(60vw 60vh at 15% 10%, #ff6b6b66, transparent 60%),
      radial-gradient(60vw 60vh at 90% 90%, #38bdf866, transparent 60%),
      linear-gradient(150deg,#3b2a9e,#6a2fc0 55%,#c0398f); animation:pop .25s ease-out; }
  @keyframes pop { from { transform:scale(.94); opacity:0; } to { transform:none; opacity:1; } }
  #clue .top { display:flex; justify-content:space-between; padding:18px 28px; font-family:var(--display); font-weight:600;
    font-size:clamp(16px,2vw,28px); text-transform:uppercase; letter-spacing:2px; }
  #clue .top span { background:#ffffff26; padding:6px 18px; border-radius:999px; }
  #clue .top span:empty { display:none; }
  #clueText { flex:1; display:flex; align-items:center; justify-content:center; text-align:center; padding:3vw 8vw;
    font-family:var(--display); font-weight:600; font-size:clamp(28px,4.6vw,72px); line-height:1.25; text-shadow:0 4px 18px #0004; }
  #answerText { min-height:1.4em; text-align:center; font-family:var(--display); font-weight:600; font-size:clamp(22px,3.2vw,48px);
    padding:0 6vw 18px; color:#ffe066; animation:pop .3s cubic-bezier(.3,1.6,.5,1); }
  #answerText:empty { animation:none; }
  #clueActions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; padding:16px 18px 24px; background:#00000026; align-items:center; }
  #timerBar { height:10px; background:linear-gradient(90deg,var(--c3),var(--c2),var(--c1)); width:100%; transform-origin:left; border-radius:0 6px 6px 0; }
  .dd { font-size:clamp(40px,8vw,120px); font-weight:700; background:linear-gradient(90deg,#ffe066,#ff9f1c,#ff6b6b);
    -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 4px 12px #0005); animation:pop .5s cubic-bezier(.3,1.6,.5,1); }
  #hostAnswer { text-align:center; color:#a8ffdf; font-size:16px; padding:8px 18px; background:#00000040; }
  #hostAnswer:empty { display:none; }

  body.display header, body.display .adj, body.display #clueActions, body.display #hostAnswer { display:none !important; }
  body.display .tile, body.display .team .name { cursor:default; }
  body.display .tile:hover:not(.used) { transform:none; filter:none; }
  body.display #board:empty::after { content:"Waiting for host…"; font-size:32px; opacity:.6; grid-column:1/-1; align-self:center; text-align:center; font-family:var(--display); }
  #fsHint { position:fixed; bottom:10px; right:14px; opacity:.5; font-size:13px; z-index:30; background:#0004; padding:4px 12px; border-radius:999px; }

  /* Editor */
  #editor { position:fixed; inset:0; z-index:20; overflow:auto; padding:22px 28px 60px;
    background:linear-gradient(160deg,var(--bg1),var(--bg2)); }
  #editor h2,#editor h3 { font-family:var(--display); font-weight:600; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:8px 0 16px; }
  input,textarea { background:#ffffff1a; color:#fff; border:2px solid transparent; border-radius:12px; padding:8px 12px; font:inherit; outline:none; }
  input:focus,textarea:focus { border-color:var(--c4); background:#ffffff26; }
  input::placeholder,textarea::placeholder { color:#ffffff80; }
  textarea { width:100%; resize:vertical; }
  .catEd { background:#ffffff14; border-radius:18px; padding:14px; margin-bottom:16px; }
  .catEd > input { width:100%; font-family:var(--display); font-weight:600; text-transform:uppercase; margin-bottom:10px; }
  .clueEd { display:grid; grid-template-columns:70px 1fr 1fr; gap:8px; margin-bottom:8px; align-items:start; }
  .clueEd .v { text-align:center; color:var(--c2); font-weight:800; padding-top:10px; }
  .clueEd textarea { height:50px; }
  .final { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  label { font-size:13px; opacity:.9; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>JEOPARDY!</h1>
    <span class="sp"></span>
    <button class="btn gold" id="btnTV" title="Open the audience view in a second window for your TV">📺 TV Display</button>
    <button class="btn" id="btnFinal">Final Jeopardy</button>
    <button class="btn" id="btnEdit">Edit Board</button>
    <button class="btn" id="btnReset">New Game</button>
    <button class="btn ghost" id="btnFull" title="Full screen">⛶</button>
  </header>
  <div id="boardWrap"><div id="board"></div></div>
  <div id="scores"></div>
</div>

<div id="clue" class="hidden">
  <div id="timerBar"></div>
  <div class="top"><span id="clueCat"></span><span id="clueVal"></span></div>
  <div id="clueText"></div>
  <div id="answerText"></div>
  <div id="hostAnswer"></div>
  <div id="clueActions"></div>
</div>

<div id="editor" class="hidden">
  <h2>Edit Game</h2>
  <div class="row">
    <label>Teams (comma-separated)</label>
    <input id="teamsInput" size="40">
    <label>Base value</label>
    <input id="baseVal" type="number" value="200" step="100" min="100" style="width:90px">
    <label>Timer (sec)</label>
    <input id="timerSec" type="number" value="15" min="0" style="width:70px">
    <label><input type="checkbox" id="ddOn" checked> Daily Double</label>
  </div>
  <div class="row">
    <button class="btn" id="edSample">Load sample board</button>
    <button class="btn" id="edExport">Export JSON</button>
    <button class="btn" id="edImport">Import JSON</button>
    <input type="file" id="importFile" accept=".json" class="hidden">
  </div>
  <div id="catEditors"></div>
  <h3>Final Jeopardy</h3>
  <div class="final">
    <input id="fCat" placeholder="Category">
    <textarea id="fClue" placeholder="Clue" style="height:48px"></textarea>
    <textarea id="fAns" placeholder="Answer" style="height:48px"></textarea>
  </div>
  <div class="row" style="margin-top:20px">
    <button class="btn gold" id="edSave">Save &amp; Play</button>
    <button class="btn ghost" id="edCancel">Cancel</button>
  </div>
</div>

<div id="fsHint" class="hidden">Press F or click for full screen</div>

<script>
const KEY = "jeopardy-mac-v1";
const NCAT = 6, NROW = 5;

const SAMPLE = {
  teams: ["Team 1","Team 2","Team 3"], base: 200, timer: 15, dd: true,
  cats: [
    {name:"Science", clues:[
      ["This planet is known as the Red Planet","What is Mars?"],
      ["H2O is the chemical formula for this","What is water?"],
      ["This force keeps planets in orbit around the sun","What is gravity?"],
      ["The powerhouse of the cell","What is the mitochondria?"],
      ["Element with atomic number 79","What is gold?"]]},
    {name:"World Capitals", clues:[
      ["Capital of France","What is Paris?"],
      ["Capital of Japan","What is Tokyo?"],
      ["Capital of Australia (not Sydney!)","What is Canberra?"],
      ["Capital of Brazil","What is Brasília?"],
      ["Capital of Canada","What is Ottawa?"]]},
    {name:"Movies", clues:[
      ["Clownfish Nemo's dad is named this","Who is Marlin?"],
      ["This 1997 film features Jack and Rose on a doomed ship","What is Titanic?"],
      ["Director of Jaws and E.T.","Who is Steven Spielberg?"],
      ["Hobbit who carries the One Ring","Who is Frodo?"],
      ["'I'll be back' is a line from this film","What is The Terminator?"]]},
    {name:"Food & Drink", clues:[
      ["Italian dish of flattened dough, tomato sauce and cheese","What is pizza?"],
      ["Japanese dish of vinegared rice and seafood","What is sushi?"],
      ["Spice that is the world's most expensive by weight","What is saffron?"],
      ["Fermented cabbage dish national to Korea","What is kimchi?"],
      ["Bean used to make chocolate","What is cacao?"]]},
    {name:"History", clues:[
      ["First U.S. president","Who is George Washington?"],
      ["Ancient wonder located near Cairo","What are the Pyramids of Giza?"],
      ["Year Columbus sailed the ocean blue","What is 1492?"],
      ["Wall that fell in 1989","What is the Berlin Wall?"],
      ["Queen of ancient Egypt who allied with Mark Antony","Who is Cleopatra?"]]},
    {name:"Mac Attack", clues:[
      ["Company that makes the Mac","What is Apple?"],
      ["Key combo to copy on a Mac","What is Command-C?"],
      ["Mac's built-in web browser","What is Safari?"],
      ["Mac's file manager app","What is Finder?"],
      ["Name of Mac's menu-bar search feature","What is Spotlight?"]]}
  ],
  final: {cat:"Famous Firsts", clue:"In 1969 this man became the first to walk on the Moon", ans:"Who is Neil Armstrong?"}
};

let game;      // config + state
let state;     // used tiles, scores, dd position
let current = null, timerInt = null;

const $ = id => document.getElementById(id);
const clone = o => JSON.parse(JSON.stringify(o));
const DISPLAY = new URLSearchParams(location.search).has("display");
let tvWin = null;

/* Host -> TV sync. The TV window never receives clue answers until revealed. */
function snapshot(){
  return { cats:game.cats.map(c=>c.name), teams:game.teams, base:game.base, used:state.used,
    scores:state.scores, active:state.active,
    clue: current ? { view:current.view, answer:current.revealed?current.answer:"", t0:current.t0||null, secs:game.timer } : null };
}
function broadcast(){ if(!DISPLAY && tvWin && !tvWin.closed) tvWin.postMessage({jeo:snapshot()},"*"); }

function save(){ try{ localStorage.setItem(KEY, JSON.stringify({game,state})); }catch(e){} }
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.game && s.state){ game=s.game; state=s.state; return; } }catch(e){}
  game = clone(SAMPLE); newState();
}
function newState(){
  state = { used:{}, scores:game.teams.map(()=>0), active:0,
    dd: game.dd ? [Math.floor(Math.random()*NCAT), 1+Math.floor(Math.random()*(NROW-1))] : null };
}
const valueOf = r => game.base * (r+1);

function renderBoard(){
  const b = $("board"); b.innerHTML = "";
  game.cats.forEach(c => { const d=document.createElement("div"); d.className="cat"; d.textContent=c.name; b.appendChild(d); });
  for(let r=0;r<NROW;r++) for(let c=0;c<NCAT;c++){
    const t=document.createElement("button"); const k=c+","+r;
    t.className="tile"+(state.used[k]?" used":"");
    t.textContent = state.used[k] ? "" : "$"+valueOf(r);
    if(!state.used[k] && !DISPLAY) t.onclick=()=>openClue(c,r);
    b.appendChild(t);
  }
  b.style.gridTemplateRows = "auto repeat("+NROW+",1fr)";
}

function renderScores(){
  const s=$("scores"); s.innerHTML="";
  game.teams.forEach((n,i)=>{
    const d=document.createElement("div"); d.className="team"+(i===state.active?" active":"");
    d.innerHTML='<div class="name"></div><div class="pts"></div><div class="adj"><button data-d="-100">−100</button><button data-d="100">+100</button></div>';
    d.querySelector(".name").textContent=n;
    if(!DISPLAY) d.querySelector(".name").onclick=()=>{ state.active=i; save(); renderScores(); };
    d.querySelector(".name").title="Click to make this team the active team";
    const p=d.querySelector(".pts"); p.textContent=fmt(state.scores[i]); if(state.scores[i]<0)p.classList.add("neg");
    d.querySelectorAll("button").forEach(b=>b.onclick=()=>{ state.scores[i]+=+b.dataset.d; save(); renderScores(); });
    s.appendChild(d);
  });
  broadcast();
}
const fmt = n => (n<0?"-":"")+"$"+Math.abs(n).toLocaleString();

/* ---------- Clue flow ---------- */
function paintClue(v,ans){
  $("clueCat").textContent=v.cat; $("clueVal").textContent=v.val;
  if(v.big) $("clueText").innerHTML='<span class="dd">'+esc(v.big)+'</span>'; else $("clueText").textContent=v.text;
  $("answerText").textContent=ans||"";
}
function setView(v){ current.view=v; paintClue(v,current.revealed?current.answer:""); broadcast(); }

function openClue(c,r){
  const isDD = state.dd && state.dd[0]===c && state.dd[1]===r;
  current = {c,r,isDD,final:false,wager:valueOf(r),revealed:false,t0:null};
  $("hostAnswer").textContent="";
  $("timerBar").style.transform="scaleX(0)";
  $("clue").classList.remove("hidden");
  if(isDD){
    setView({cat:game.cats[c].name,val:"",big:"DAILY DOUBLE!"});
    const max = Math.max(state.scores[state.active], valueOf(NROW-1));
    $("clueActions").innerHTML = '<label>Wager for '+esc(game.teams[state.active])+' (max $'+max+'): </label><input id="wager" type="number" min="0" max="'+max+'" value="'+valueOf(r)+'" style="width:110px"> <button class="btn gold" id="ddGo">Show clue</button>';
    $("ddGo").onclick=()=>{ current.wager=Math.max(0,Math.min(max,+$("wager").value||0)); showClue(); };
  } else showClue();
}
function showClue(){
  const {c,r,isDD,final} = current;
  const [q,a] = final ? [game.final.clue, game.final.ans] : game.cats[c].clues[r];
  current.answer = a || "(no answer)";
  $("hostAnswer").textContent = "Host only — answer: "+current.answer;
  setView({ cat: final ? "Final Jeopardy: "+(game.final.cat||"") : game.cats[c].name,
            val: final ? "Final Jeopardy" : isDD ? "Wager $"+current.wager : "$"+valueOf(r),
            text: q || "(empty clue)" });
  renderClueActions();
  startTimer();
}
function renderClueActions(){
  const el=$("clueActions"); el.innerHTML="";
  const add=(txt,cls,fn)=>{ const b=document.createElement("button"); b.className="btn "+cls; b.textContent=txt; b.onclick=fn; el.appendChild(b); };
  if(current.final){
    add("Reveal answer (Space)","gold",reveal);
    game.teams.forEach((n,i)=>{
      add("✓ "+n,"green",()=>{ const w=+prompt("Wager for "+n+"?","0")||0; state.scores[i]+=w; save(); renderScores(); });
      add("✗ "+n,"red",()=>{ const w=+prompt("Wager for "+n+"?","0")||0; state.scores[i]-=w; save(); renderScores(); });
    });
    add("Close","ghost",closeClue);
    return;
  }
  add("Reveal answer (Space)","gold",reveal);
  const amt = current.isDD ? current.wager : valueOf(current.r);
  game.teams.forEach((n,i)=>{
    add("✓ "+n+" +"+amt,"green",()=>score(i,amt));
    if(!current.isDD) add("✗ "+n+" −"+amt,"red",()=>score(i,-amt));
  });
  if(current.isDD) add("✗ Wrong −"+amt,"red",()=>score(state.active,-amt));
  add("No one / skip","ghost",closeClue);
}
function score(i,amt){ state.scores[i]+=amt; if(amt>0) state.active=i; if(amt<0 && !current.isDD){ save(); renderScores(); return; } closeClue(); }
function reveal(){ if(!current || !current.answer) return; current.revealed=true; $("answerText").textContent=current.answer; stopTimer(); broadcast(); }
function closeClue(){
  stopTimer();
  if(current && !current.final){ state.used[current.c+","+current.r]=true; }
  current=null; $("clue").classList.add("hidden");
  save(); renderBoard(); renderScores();
}
function startTimer(secs=game.timer, t0=Date.now()){
  stopTimer();
  if(current && !DISPLAY){ current.t0=t0; broadcast(); }
  const bar=$("timerBar");
  if(!secs){ bar.style.transform="scaleX(0)"; return; }
  timerInt=setInterval(()=>{
    const f=1-(Date.now()-t0)/(secs*1000);
    bar.style.transform="scaleX("+Math.max(0,f)+")";
    if(f<=0) stopTimer();
  },50);
}
function stopTimer(){ clearInterval(timerInt); timerInt=null; }

/* ---------- Final Jeopardy ---------- */
$("btnFinal").onclick=()=>{
  current={final:true,revealed:false,t0:null};
  $("hostAnswer").textContent="";
  $("timerBar").style.transform="scaleX(0)";
  $("clue").classList.remove("hidden");
  setView({cat:"Final Jeopardy: "+(game.final.cat||""),val:"",big:"FINAL JEOPARDY"});
  $("clueActions").innerHTML='<button class="btn gold" id="fShow">Show clue</button> <button class="btn ghost" id="fClose">Close</button>';
  $("fShow").onclick=showClue;
  $("fClose").onclick=closeClue;
};

/* ---------- TV display window ---------- */
$("btnTV").onclick=()=>{
  const url=location.href.split("#")[0].split("?")[0]+"?display=1";
  tvWin=window.open(url,"jeopardyTV","width=1280,height=720");
  if(!tvWin){ alert("The browser blocked the pop-up. Allow pop-ups for this page and try again."); return; }
  setTimeout(broadcast,600);
};
window.addEventListener("message",e=>{
  if(!e.data) return;
  if(DISPLAY && e.data.jeo) displayRender(e.data.jeo);
  if(!DISPLAY && e.data.jeoReady) broadcast();
});
function displayRender(s){
  game={cats:s.cats.map(n=>({name:n,clues:[]})),teams:s.teams,base:s.base,timer:0,final:{}};
  state={used:s.used,scores:s.scores,active:s.active,dd:null};
  renderBoard(); renderScores();
  if(!s.clue){ stopTimer(); $("clue").classList.add("hidden"); return; }
  $("clue").classList.remove("hidden");
  paintClue(s.clue.view, s.clue.answer);
  if(s.clue.answer){ stopTimer(); }
  else if(s.clue.t0 && s.clue.t0!==displayRender.t0){ displayRender.t0=s.clue.t0; startTimer(s.clue.secs,s.clue.t0); }
  else if(!s.clue.t0){ stopTimer(); displayRender.t0=null; $("timerBar").style.transform="scaleX(0)"; }
}

/* ---------- Editor ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function openEditor(){
  $("teamsInput").value=game.teams.join(", "); $("baseVal").value=game.base; $("timerSec").value=game.timer; $("ddOn").checked=!!game.dd;
  const ce=$("catEditors"); ce.innerHTML="";
  game.cats.forEach((c,ci)=>{
    const d=document.createElement("div"); d.className="catEd";
    let h='<input data-cat="'+ci+'" placeholder="Category '+(ci+1)+'" value="'+esc(c.name)+'">';
    for(let r=0;r<NROW;r++){
      const [q,a]=c.clues[r]||["",""];
      h+='<div class="clueEd"><div class="v">Row '+(r+1)+'</div><textarea data-q="'+ci+','+r+'" placeholder="Clue">'+esc(q)+'</textarea><textarea data-a="'+ci+','+r+'" placeholder="Answer (e.g. What is…?)">'+esc(a)+'</textarea></div>';
    }
    d.innerHTML=h; ce.appendChild(d);
  });
  $("fCat").value=game.final.cat; $("fClue").value=game.final.clue; $("fAns").value=game.final.ans;
  $("editor").classList.remove("hidden");
}
function readEditor(){
  const g={ teams:$("teamsInput").value.split(",").map(s=>s.trim()).filter(Boolean).slice(0,6), base:Math.max(1,+$("baseVal").value||200),
    timer:Math.max(0,+$("timerSec").value||0), dd:$("ddOn").checked, cats:[], final:{cat:$("fCat").value,clue:$("fClue").value,ans:$("fAns").value} };
  if(!g.teams.length) g.teams=["Team 1"];
  for(let c=0;c<NCAT;c++){
    const cat={name:document.querySelector('[data-cat="'+c+'"]').value, clues:[]};
    for(let r=0;r<NROW;r++) cat.clues.push([document.querySelector('[data-q="'+c+','+r+'"]').value, document.querySelector('[data-a="'+c+','+r+'"]').value]);
    g.cats.push(cat);
  }
  return g;
}
$("btnEdit").onclick=openEditor;
$("edCancel").onclick=()=>$("editor").classList.add("hidden");
$("edSave").onclick=()=>{ game=readEditor(); newState(); save(); $("editor").classList.add("hidden"); renderBoard(); renderScores(); };
$("edSample").onclick=()=>{ if(confirm("Replace everything in the editor with the sample board?")){ game=clone(SAMPLE); openEditor(); } };
$("edExport").onclick=()=>{
  const blob=new Blob([JSON.stringify(readEditor(),null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="jeopardy-game.json"; a.click();
};
$("edImport").onclick=()=>$("importFile").click();
$("importFile").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{ try{ const g=JSON.parse(rd.result); if(!g.cats||!g.teams) throw 0; game=g; openEditor(); }catch(_){ alert("That doesn't look like a Jeopardy game file."); } };
  rd.readAsText(f); e.target.value="";
};

/* ---------- Misc ---------- */
$("btnReset").onclick=()=>{ if(confirm("Start a new game? Scores and used clues reset (board content is kept).")){ newState(); save(); renderBoard(); renderScores(); } };
$("btnFull").onclick=()=>{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); };
document.addEventListener("keydown",e=>{
  if(!current || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.code==="Space"){ e.preventDefault(); reveal(); }
  if(e.key==="Escape") closeClue();
});

if(DISPLAY){
  document.body.classList.add("display"); document.title="Jeopardy! — TV";
  const h=$("fsHint"); h.classList.remove("hidden");
  const fs=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); };
  document.addEventListener("click",fs); document.addEventListener("keydown",e=>{ if(e.key==="f"||e.key==="F") fs(); });
  document.addEventListener("fullscreenchange",()=>h.classList.toggle("hidden",!!document.fullscreenElement));
  game={cats:[],teams:[],base:200,timer:0,final:{}}; state={used:{},scores:[],active:0,dd:null};
  if(window.opener) window.opener.postMessage({jeoReady:1},"*");
} else { load(); renderBoard(); renderScores(); }
</script>
</body>
